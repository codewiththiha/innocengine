name: Release

on:
  push:
    tags:
      - 'v*'
  # Tags are the normal path; this exists so a failed release can be retried
  # without deleting and re-pushing the tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build release packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify and package release
        run: npm run release:build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
            releases/*.xpi
