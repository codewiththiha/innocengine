name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run compile

      - name: Run Engine Tuning, MultiPV & Maia-3 Test Suite
        run: npm test

      - name: Build Chrome Extension (MV3)
        run: npm run build

      - name: Package Extension ZIP
        run: npm run zip

      # The release workflow builds Firefox for the first time, so the same
      # steps run here: a Gecko break should fail a push, not a tag.
      - name: Build Firefox Extension (MV2 + MV3)
        run: |
          npm run build:firefox
          npm run build:firefox:mv3

      - name: Package Firefox zip, AMO sources and XPI
        run: |
          npm run zip:firefox
          npm run xpi:firefox

      # `.output` is a dot-directory and upload-artifact skips hidden files, so
      # everything is gathered next to the XPI before it is uploaded.
      - name: Collect release artefacts
        run: npm run artifacts:collect

      - name: Verify release artefacts
        run: npm run artifacts:verify

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: innocengine-extension
          path: releases/*
